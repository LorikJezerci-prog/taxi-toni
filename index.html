<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taxi Toni</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taxi Toni">
<meta name="theme-color" content="#141413">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one-column phone app, fixed tab bar with a raised taxi-yellow ＋, detail screens slide over as full sheets */
:root{
  --bg:#F4F4F1; --card:#FFFFFF; --ink:#111110; --muted:#66655F; --line:#E7E6E1; --fill:#EAE9E4;
  --taxi:#FFC72C; --on-taxi:#111110;
  --hero:#141413; --hero-fg:#FFFFFF; --hero-muted:#BDBCB6; --hero-btn:#2C2C2A; --hero-line:#3A3A37;
  --ok:#1F7A4D; --run:#8A5A00; --note:#FFF5D6; --note-fg:#3A2D00; --danger:#B42318; --focus:#2F6FEB;
  --shadow:0 1px 2px rgba(17,17,16,.05),0 4px 14px rgba(17,17,16,.04);
  --hero-shadow:0 10px 30px rgba(17,17,16,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0D0C; --card:#1A1A18; --ink:#F3F2EE; --muted:#A4A39C; --line:#2C2C29; --fill:#262624;
    --hero:#22221F; --hero-fg:#FFFFFF; --hero-muted:#B5B4AE; --hero-btn:#34342F; --hero-line:#45453F;
    --ok:#4CC38A; --run:#F2C14E; --note:#2A2410; --note-fg:#F2E3B3; --danger:#F07167; --focus:#7AA7FF;
    --shadow:none; --hero-shadow:0 0 0 1px #34342F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0D0C; --card:#1A1A18; --ink:#F3F2EE; --muted:#A4A39C; --line:#2C2C29; --fill:#262624;
  --hero:#22221F; --hero-fg:#FFFFFF; --hero-muted:#B5B4AE; --hero-btn:#34342F; --hero-line:#45453F;
  --ok:#4CC38A; --run:#F2C14E; --note:#2A2410; --note-fg:#F2E3B3; --danger:#F07167; --focus:#7AA7FF;
  --shadow:none; --hero-shadow:0 0 0 1px #34342F; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}

#view{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:16px 130px;display:flex;flex-direction:column;gap:22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:12px}
.eyebrow{font-size:14px;font-weight:500;color:var(--muted)}
.h1{font-size:32px;font-weight:700;letter-spacing:-.5px}
.label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding-left:4px}
.section{display:flex;flex-direction:column;gap:8px}
.section-head{display:flex;justify-content:space-between;align-items:center}
.h2{font-size:20px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}

.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column}
.list > * + *{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;min-height:52px;width:100%;background:none;border:0;text-align:left;text-decoration:none}
.row .t{font-weight:700;font-size:17px;width:50px;flex-shrink:0}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .name{font-weight:600}
.row .sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;flex-shrink:0}
.row.done .name{color:var(--muted);text-decoration:line-through}
.empty{padding:18px 16px;color:var(--muted);font-size:15px}

.icon-btn{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);text-decoration:none}
.icon-btn.soft{background:var(--fill);box-shadow:none}
.btn{min-height:56px;border-radius:16px;border:0;font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 18px}
.btn-taxi{background:var(--taxi);color:var(--on-taxi)}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-soft{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn-ok{background:transparent;color:var(--ok);border:2px solid var(--ok)}
.btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.btn-full{width:100%}

.hero{background:var(--hero);color:var(--hero-fg);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--hero-shadow)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero-label{font-size:13px;font-weight:600;color:var(--hero-muted);text-transform:uppercase;letter-spacing:.6px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--taxi);color:var(--on-taxi);white-space:nowrap}
.hero-time{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero-time b{font-size:44px;letter-spacing:-1px;line-height:1}
.hero-time span{font-size:20px;font-weight:600}
.route{display:grid;grid-template-columns:14px minmax(0,1fr);column-gap:12px;row-gap:12px;font-size:16px}
.route .dot{width:10px;height:10px;border-radius:50%;background:var(--taxi);margin-top:5px}
.route .sq{width:10px;height:10px;border-radius:2px;background:var(--hero-fg);margin-top:5px}
.hero-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--hero-muted)}
.hero-meta b{color:var(--hero-fg);font-weight:600}
.hero-actions{display:flex;gap:10px}
.hero-actions .btn{flex:1}
.hero .icon-btn{width:56px;height:56px;border-radius:16px;background:var(--hero-btn);color:var(--hero-fg);box-shadow:none}
.hero-link{background:none;border:0;color:var(--taxi);font-weight:600;font-size:15px;padding:8px 0}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:14px 4px;border:0;width:100%;text-align:center}
.kpi{display:flex;flex-direction:column;gap:2px;align-items:center}
.kpi b{font-size:21px}
.kpi span{font-size:12px;color:var(--muted)}

.favs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fav{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;font-size:13px;font-weight:500;min-width:0}
.fav span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.avatar.on{background:var(--taxi);color:var(--on-taxi)}
.avatar.sm{width:40px;height:40px;font-size:14px;background:var(--fill);box-shadow:none}
.avatar.lg{width:84px;height:84px;font-size:30px}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--note);color:var(--note-fg);border-radius:16px;padding:12px 14px;font-size:14px}
.banner button{background:none;border:0;font-weight:700;color:inherit;padding:8px 4px;white-space:nowrap}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{height:64px;border:0;border-radius:16px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day small{font-size:12px;font-weight:600;opacity:.75}
.day b{font-size:18px}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day.busy i{background:var(--ink)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.day[aria-pressed="true"].busy i{background:var(--taxi)}
.day.today:not([aria-pressed="true"]) b{color:var(--danger)}
.weeknav{display:flex;gap:6px}
.now{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--danger)}
.now::after{content:"";flex:1;height:2px;background:var(--danger);border-radius:1px}
.slot{display:flex;gap:12px;background:none;border:0;padding:0;text-align:left;width:100%}
.slot .t{width:50px;flex-shrink:0;font-weight:700;padding-top:15px}
.slot .box{flex:1;min-width:0;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:5px}
.slot .box.next{background:var(--hero);color:var(--hero-fg);box-shadow:var(--hero-shadow)}
.slot .box.next .sub{color:var(--hero-muted)}
.slot .box.done{opacity:.6}
.slot .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.slot .name{font-weight:700;font-size:17px}
.slot .sub{font-size:14px;color:var(--muted)}
.slot .meta{font-size:14px;font-weight:600}

.search{height:44px;border-radius:14px;background:var(--fill);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;color:var(--ink);outline:none}
.seg{background:var(--fill);border-radius:12px;padding:3px;display:grid;gap:3px}
.seg button{min-height:36px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sum{background:var(--hero);color:var(--hero-fg);border-radius:20px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--hero-shadow)}
.sum .big{font-size:28px;font-weight:700;color:var(--taxi)}
.sum .muted{color:var(--hero-muted)}

/* Sheets */
#sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-motion: no-preference){ #sheet.in{animation:slide .22s ease-out} @keyframes slide{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
.sheet-inner{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:4px 150px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:52px;margin-inline:-8px;gap:8px}
.bar h2{font-size:17px;font-weight:700}
.link-btn{background:none;border:0;font-size:17px;padding:10px 8px;display:inline-flex;align-items:center;gap:2px;min-height:44px}
.link-btn.strong{font-weight:700}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.bottom > *{max-width:520px;margin:0 auto}
.status{font-size:14px;font-weight:600;color:var(--muted)}
.status.run{color:var(--run);font-weight:700}
.status.done{color:var(--ok);font-weight:700}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:13px;font-weight:600;color:var(--muted)}
.tile b{font-size:24px}
.action-tile{min-height:68px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;text-decoration:none}
.action-tile.taxi{background:var(--taxi);color:var(--on-taxi);box-shadow:none;font-weight:700}
.stop{display:flex;align-items:center;gap:12px;padding:16px}
.stop .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.stop .k{font-size:13px;font-weight:600;color:var(--muted)}
.stop .v{font-size:16px;font-weight:600}
.nav-btn{width:52px;height:52px;flex-shrink:0;border-radius:16px;border:0;display:flex;align-items:center;justify-content:center;text-decoration:none;background:var(--fill);color:var(--ink)}
.nav-btn.taxi{background:var(--taxi);color:var(--on-taxi)}
.note{background:var(--note);color:var(--note-fg);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.note b{font-size:13px}
.phone{font-size:15px;color:var(--muted);text-align:center;user-select:all}
.prices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.price{background:var(--fill);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.price span{font-size:12px;color:var(--muted)}
.price b{font-size:18px}

/* Forms */
.fields{background:var(--card);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.fields > * + *{border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:2px;padding:11px 14px}
.field > span{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{border:0;background:transparent;font-size:16px;color:var(--ink);padding:0;outline:none;width:100%;min-width:0}
.field textarea{resize:none;min-height:44px}
.field.big input{font-size:22px;font-weight:700}
.field-row{display:flex;align-items:center;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4 .chip,.grid3 .chip{padding:0 4px}
.hint{font-size:13px;color:var(--ok);font-weight:600}
.err{font-size:14px;color:var(--danger);font-weight:600}

.switch{width:52px;height:32px;flex-shrink:0;border:0;border-radius:16px;padding:2px;display:flex;background:var(--line);justify-content:flex-start}
.switch[aria-checked="true"]{background:var(--ok);justify-content:flex-end}
.switch i{width:28px;height:28px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px 10px 16px;min-height:52px;width:100%;background:none;border:0;text-align:left}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}

/* Tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);min-height:50px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.fab{justify-self:center;width:60px;height:60px;border-radius:50%;border:0;background:var(--taxi);color:var(--on-taxi);margin-top:-30px;box-shadow:0 6px 18px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:15px;font-weight:600;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="view" aria-live="polite"></div>
<nav id="tabs" aria-label="Hauptnavigation"><div class="in" id="tabsIn"></div></nav>
<div id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" role="status" hidden></div>

/* ---------- Helpers ---------- */
function pad(n){return (n<10?"0":"")+n;}
function iso(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Math.random().toString(36).slice(2,9);}
function euro(n){n=Number(n)||0;return n.toLocaleString("de-DE",{maximumFractionDigits:2})+" €";}
function dur(m){m=Math.round(Number(m)||0);if(m<60)return m+" Min";var h=Math.floor(m/60),r=m%60;return h+" Std"+(r?" "+r+" Min":"");}
function hm(m){m=Math.round(Number(m)||0);return Math.floor(m/60)+":"+pad(m%60);}
function initials(n){return String(n||"?").trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join("").toUpperCase();}
function lastName(n){var p=String(n||"").trim().split(/\s+/);return p[p.length-1]||n;}
function longDate(s){return parse(s).toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});}
function shortDate(s){return parse(s).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"}).replace(",","");}
function relDay(s){var t=iso();if(s===t)return "Heute";if(s===addDays(t,1))return "Morgen";if(s===addDays(t,-1))return "Gestern";return shortDate(s);}
function at(r){var d=parse(r.date);var p=(r.time||"00:00").split(":").map(Number);d.setHours(p[0],p[1],0,0);return d;}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes();}
function tMin(t){var p=(t||"00:00").split(":").map(Number);return p[0]*60+p[1];}
function until(r){var diff=Math.round((at(r)-new Date())/60000);if(diff<=0)return "jetzt";if(diff<60)return "in "+diff+" Min";if(diff<24*60)return "in "+Math.floor(diff/60)+" Std "+(diff%60)+" Min";return relDay(r.date)+" "+r.time;}
function digits(p){return String(p||"").replace(/[^\d+]/g,"");}
function mapsUrl(addr){var a=encodeURIComponent(addr||"");return S.settings.nav==="google"?"https://www.google.com/maps/dir/?api=1&destination="+a+"&travelmode=driving":"https://maps.apple.com/?daddr="+a+"&dirflg=d";}
function msgUrl(p){var d=digits(p);if(S.settings.msg==="sms")return "sms:"+d;var w=d.replace(/^\+/,"");if(w.indexOf("00")===0)w=w.slice(2);else if(w.indexOf("0")===0)w="49"+w.slice(1);return "https://wa.me/"+w;}
function contact(id){return S.contacts.find(function(c){return c.id===id;});}
function ride(id){return S.rides.find(function(r){return r.id===id;});}
function ridesOn(d){return S.rides.filter(function(r){return r.date===d;}).sort(function(a,b){return a.time<b.time?-1:1;});}
function nextRide(){
  var run=S.rides.find(function(r){return r.status==="running";});if(run)return run;
  var now=new Date();
  return S.rides.filter(function(r){return r.status!=="done"&&at(r).getTime()+ (Number(r.dur)||0)*60000>now.getTime();})
    .sort(function(a,b){return at(a)-at(b);})[0];
}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true;},1800);}

function sheetRide(r){

  var st=r.status==="running"?'<span class="status run">Unterwegs seit '+esc(r.startedAt||"")+'</span>':r.status==="done"?'<span class="status done">Erledigt'+(r.endedAt?' · '+esc(r.startedAt||r.time)+' – '+esc(r.endedAt):'')+'</span>':'<span class="status">'+esc(shortDate(r.date))+' · '+esc(r.time)+' Uhr · '+esc(until(r))+'</span>';
  var html='<div class="sheet-inner">'+bar(backBtn(),"",'<button type="button" class="link-btn" data-a="editRide" data-id="'+r.id+'">Bearbeiten</button>')+
    '<div style="display:flex;flex-direction:column;gap:4px">'+st+'<h1 class="h1" style="font-size:30px">'+esc(r.name)+'</h1></div>';
  if(r.phone)html+='<div class="pair"><a class="btn btn-soft" style="min-height:52px;font-size:16px" href="tel:'+esc(digits(r.phone))+'">'+I.phone+'Anrufen</a><a class="btn btn-soft" style="min-height:52px;font-size:16px" href="'+esc(msgUrl(r.phone))+'" target="_blank" rel="noopener">'+I.msg+'Nachricht</a></div><div class="phone">'+esc(r.phone)+'</div>';
  html+='<section class="card list"><div class="stop"><span class="main"><span class="k">Abholung</span><span class="v">'+esc(r.from)+'</span></span><a class="nav-btn taxi" href="'+esc(mapsUrl(r.from))+'" target="_blank" rel="noopener" aria-label="Navigation zur Abholung">'+I.nav+'</a></div>'+
    '<div class="stop"><span class="main"><span class="k">Ziel</span><span class="v">'+esc(r.to)+'</span></span><a class="nav-btn" href="'+esc(mapsUrl(r.to))+'" target="_blank" rel="noopener" aria-label="Navigation zum Ziel">'+I.nav+'</a></div></section>'+
    '<div class="pair"><div class="tile"><span>Preis'+(r.ptype?' · '+esc(r.ptype):'')+'</span><b>'+euro(r.price)+'</b></div><div class="tile"><span>Fahrtdauer</span><b>'+dur(r.dur)+'</b></div></div>';
  if(r.note)html+='<div class="note"><b>Notiz</b><span>'+esc(r.note)+'</span></div>';
  if(ui.confirm)html+='<div class="confirm"><b>Fahrt wirklich löschen?</b><div class="pair"><button type="button" class="btn btn-soft" data-a="noConfirm">Behalten</button><button type="button" class="btn" style="background:var(--danger);color:#fff" data-a="delRide" data-id="'+r.id+'">Löschen</button></div></div>';
  else html+='<button type="button" class="btn btn-danger" data-a="askConfirm">Fahrt löschen</button>';
  html+='</div><div class="bottom">'+(r.status==="open"?'<button type="button" class="btn btn-taxi btn-full" data-a="start" data-id="'+r.id+'">Fahrt starten</button>':r.status==="running"?'<button type="button" class="btn btn-ink btn-full" data-a="finish" data-id="'+r.id+'">Fahrt beenden</button>':'<button type="button" class="btn btn-ok btn-full" data-a="reopen" data-id="'+r.id+'">Erledigt · '+euro(r.price)+' erfasst</button>')+'</div>';
  return html;
}

function sheetContact(c){

  var p=c.prices||{};
  var past=S.rides.filter(function(r){return r.contactId===c.id;}).sort(function(a,b){return at(b)-at(a);}).slice(0,4);
  var count=S.rides.filter(function(r){return r.contactId===c.id&&r.status==="done";}).length;
  var html='<div class="sheet-inner">'+bar(backBtn("Kontakte"),"",'<div style="display:flex"><button type="button" class="icon-btn soft" style="background:none" data-a="fav" data-id="'+c.id+'" aria-pressed="'+!!c.fav+'" aria-label="'+(c.fav?"Aus Favoriten entfernen":"Zu Favoriten")+'">'+I.star(c.fav)+'</button><button type="button" class="link-btn" data-a="editContact" data-id="'+c.id+'">Bearbeiten</button></div>')+

function sheetDay(day){
  var list=ridesOn(day), done=list.filter(function(r){return r.status==="done";});
  var sum=list.reduce(function(s,r){return s+(Number(r.price)||0);},0), got=done.reduce(function(s,r){return s+(Number(r.price)||0);},0), mins=list.reduce(function(s,r){return s+(Number(r.dur)||0);},0);
  var pct=list.length?Math.round(done.length/list.length*100):0;
  var html='<div class="sheet-inner">'+bar(backBtn())+'<div style="display:flex;flex-direction:column;gap:10px"><div><div class="eyebrow">'+esc(longDate(day))+'</div><h1 class="h1">'+esc(relDay(day))+'</h1></div>'+
    '<div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--ok);border-radius:4px"></div></div><span class="muted small">'+done.length+' von '+list.length+' erledigt · zum Abhaken antippen</span></div>';
  html+='<div class="card list">'+(list.length?list.map(function(r){var on=r.status==="done";
    return '<button type="button" class="row'+(on?" done":"")+'" data-a="toggleDone" data-id="'+r.id+'" aria-pressed="'+on+'" style="min-height:70px"><span style="width:26px;height:26px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;'+(on?'background:var(--ok);color:#fff':'border:2px solid var(--line)')+'">'+(on?"✓":"")+'</span><span class="t">'+esc(r.time)+'</span><span class="main"><span class="name">'+esc(r.name)+'</span><span class="sub">'+esc(short(r.from))+' → '+esc(short(r.to))+'</span></span><span class="amt" style="font-weight:700">'+euro(r.price)+'</span></button>';}).join(""):'<div class="empty">Keine Fahrten an diesem Tag.</div>')+'</div></div>';
  html+='<div class="bottom" style="border-top:0;background:transparent"><div class="sum" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center"><div><div style="font-size:22px;font-weight:700">'+list.length+'</div><div class="small muted">Fahrten</div></div><div><div class="big" style="font-size:22px">'+euro(sum)+'</div><div class="small muted">'+(got?euro(got)+' erledigt':'geplant')+'</div></div><div><div style="font-size:22px;font-weight:700">'+hm(mins)+'</div><div class="small muted">Std. Fahrzeit</div></div></div></div>';
  return html;
}

    '<span class="small muted" style="text-align:center">Taxi Toni · Testversion 0.1</span></div>';
  return html;
}

function renderSheet(anim){
  var el=document.getElementById("sheet"), s=top();
  if(!s){el.hidden=true;el.innerHTML="";document.body.style.overflow="";return;}
  var y=el.scrollTop;
  el.innerHTML=s.type==="ride"?sheetRide(ride(s.id)):s.type==="contact"?sheetContact(contact(s.id)):s.type==="rideForm"?sheetRideForm():s.type==="contactForm"?sheetContactForm():s.type==="day"?sheetDay(s.id):sheetSettings();
  el.hidden=false;document.body.style.overflow="hidden";
  if(anim){el.scrollTop=0;el.classList.remove("in");void el.offsetWidth;el.classList.add("in");}else el.scrollTop=y;
}

/* ---------- Drafts ---------- */
function newDraft(cid){
  var c=cid&&contact(cid), p=(c&&c.prices)||{};
  var type=c&&/flughafen/i.test(c.dest+" "+c.pickup)&&p.Flughafen?"Flughafen":"Standard";
  var h=new Date();h.setMinutes(h.getMinutes()+60);h.setMinutes(Math.ceil(h.getMinutes()/15)*15);
  return {id:null,contactId:c?c.id:"",name:c?c.name:"",phone:c?c.phone:"",from:c?c.pickup:"",to:c?c.dest:"",date:iso(h),time:pad(h.getHours())+":"+pad(h.getMinutes()),ptype:type,price:c?(p[type]||p.Standard||""):"",dur:c?c.dur:"",note:c?c.note:""};
}
function applyContact(d,c){
  var p=(c&&c.prices)||{};
  d.contactId=c?c.id:"";d.name=c?c.name:"";d.phone=c?c.phone:"";d.from=c?c.pickup:"";d.to=c?c.dest:"";d.dur=c?c.dur:"";d.note=c?c.note:"";
  d.ptype=c&&/flughafen/i.test(c.dest+" "+c.pickup)&&p.Flughafen?"Flughafen":"Standard";d.price=c?(p[d.ptype]||p.Standard||""):"";
}

/* ---------- Actions ---------- */
var A={
  tab:function(e){ui.tab=e.dataset.v;ui.stack=[];window.scrollTo(0,0);render();},
  newRide:function(e){ui.draft=newDraft(e.dataset.c);if(ui.tab==="cal"&&!e.dataset.c&&ui.cal>=iso())ui.draft.date=ui.cal;openSheet({type:"rideForm"});},
  editRide:function(e){var r=ride(e.dataset.id);ui.draft=JSON.parse(JSON.stringify(r));openSheet({type:"rideForm"});},
  ride:function(e){openSheet({type:"ride",id:e.dataset.id});},
  contact:function(e){openSheet({type:"contact",id:e.dataset.id});},
  editContact:function(e){var c=e.dataset.id&&contact(e.dataset.id);ui.draft=c?JSON.parse(JSON.stringify(c)):{id:null,name:"",phone:"",pickup:"",dest:"",dur:"",prices:{},note:"",fav:false};openSheet({type:"contactForm"});},
  day:function(e){openSheet({type:"day",id:e.dataset.v});},
  settings:function(){openSheet({type:"settings"});},
  back:function(){closeSheet();},
  week:function(e){ui.cal=addDays(ui.cal,Number(e.dataset.v));render();},
  calToday:function(){ui.cal=iso();render();},
  calDay:function(e){ui.cal=e.dataset.v;render();},
  range:function(e){ui.range=e.dataset.v;render();},
  pickContact:function(e){applyContact(ui.draft,e.dataset.id?contact(e.dataset.id):null);renderSheet();},
  draftDate:function(e){ui.draft.date=e.dataset.v;renderSheet();},
  ptype:function(e){var d=ui.draft,c=d.contactId&&contact(d.contactId);d.ptype=e.dataset.v;if(c&&c.prices&&c.prices[d.ptype])d.price=c.prices[d.ptype];if(d.ptype==="Sonder")d.price="";renderSheet();var p=document.getElementById("f-price");if(p&&d.ptype==="Sonder")p.focus();},
  swap:function(){var d=ui.draft,x=d.from;d.from=d.to;d.to=x;renderSheet();},
  start:function(e){var r=ride(e.dataset.id);S.rides.forEach(function(o){if(o.status==="running"&&o.id!==r.id)o.status="open";});r.status="running";r.startedAt=pad(new Date().getHours())+":"+pad(new Date().getMinutes());save();renderSheet();toast("Fahrt gestartet");},
  finish:function(e){var r=ride(e.dataset.id);r.status="done";r.endedAt=pad(new Date().getHours())+":"+pad(new Date().getMinutes());save();renderSheet();toast(euro(r.price)+" erfasst");},
  reopen:function(e){var r=ride(e.dataset.id);r.status="open";delete r.startedAt;delete r.endedAt;save();renderSheet();},
  toggleDone:function(e){var r=ride(e.dataset.id);r.status=r.status==="done"?"open":"done";save();renderSheet();},
  askConfirm:function(){ui.confirm=true;renderSheet();},
  noConfirm:function(){ui.confirm=false;renderSheet();},
  delRide:function(e){S.rides=S.rides.filter(function(r){return r.id!==e.dataset.id;});save();ui.stack.pop();ui.confirm=false;render();toast("Fahrt gelöscht");},
  delContact:function(e){S.contacts=S.contacts.filter(function(c){return c.id!==e.dataset.id;});save();ui.stack.pop();ui.confirm=false;render();toast("Kontakt gelöscht");},
  fav:function(e){var c=contact(e.dataset.id);c.fav=!c.fav;save();renderSheet();},
  sw:function(e){var k=e.dataset.v;S.settings[k]=!S.settings[k];save();renderSheet();},
  set:function(e){S.settings[e.dataset.k]=e.dataset.v;save();applyTheme();renderSheet();},
  clearAll:function(){if(top()&&top().type==="settings"){ui.confirm="clear";renderSheet();}else{openSheet({type:"settings"});ui.confirm="clear";renderSheet();}},
  doClear:function(){S.contacts=[];S.rides=[];S.sample=false;save();ui.confirm=false;ui.stack=[];render();toast("Alles gelöscht");},
  resetSample:function(){ui.confirm="reset";renderSheet();},
  doReset:function(){var st=S.settings;S=seed();S.settings=st;save();ui.confirm=false;ui.stack=[];render();toast("Beispieldaten geladen");},
  copyCsv:function(){
    var rows=[["Datum","Uhrzeit","Kunde","Abholung","Ziel","Preis","Preisart","Dauer Min","Status"]].concat(S.rides.slice().sort(function(a,b){return at(a)-at(b);}).map(function(r){return [r.date,r.time,r.name,r.from,r.to,String(r.price).replace(".",","),r.ptype||"",r.dur,r.status==="done"?"erledigt":"offen"];}));
    var csv=rows.map(function(r){return r.map(function(v){v=String(v==null?"":v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(";");}).join("\n");
    try{navigator.clipboard.writeText(csv).then(function(){toast("CSV kopiert");},function(){toast("Kopieren nicht möglich");});}catch(err){toast("Kopieren nicht möglich");}
  }
};

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-a]");if(!el)return;
  var fn=A[el.dataset.a];if(fn){ev.preventDefault();fn(el);}
});
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.dataset.search==="contacts"){ui.q=t.value;var r=document.getElementById("cres");if(r)r.innerHTML=contactRows(ui.q);return;}
  if(t.dataset.search==="history"){ui.hq=t.value;var h=document.getElementById("hres");if(h)h.innerHTML=historyList();return;}
  if(ui.draft&&t.dataset.f){ui.draft[t.dataset.f]=t.value;if(t.dataset.f==="date"){document.querySelectorAll('[data-a="draftDate"]').forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.v===t.value));});}}
  if(ui.draft&&t.dataset.p){ui.draft.prices=ui.draft.prices||{};ui.draft.prices[t.dataset.p]=t.value===""?0:Number(t.value);}
});
document.addEventListener("submit",function(ev){
  ev.preventDefault();var d=ui.draft,err=document.getElementById("formErr");
  function fail(m){err.textContent=m;err.hidden=false;}
  if(ev.target.id==="rideForm"){
    if(!d.name.trim())return fail("Bitte einen Kunden wählen oder einen Namen eintragen.");
    if(!d.from.trim())return fail("Bitte eine Abholadresse eintragen.");
    if(!d.date||!d.time)return fail("Bitte Datum und Uhrzeit angeben.");
    var r={id:d.id||uid(),contactId:d.contactId||"",name:d.name.trim(),phone:(d.phone||"").trim(),date:d.date,time:d.time,from:d.from.trim(),to:(d.to||"").trim(),price:Number(String(d.price).replace(",","."))||0,ptype:d.ptype,dur:Number(d.dur)||0,note:(d.note||"").trim(),status:d.status||"open",startedAt:d.startedAt,endedAt:d.endedAt};
    var i=S.rides.findIndex(function(x){return x.id===r.id;});if(i>=0)S.rides[i]=r;else S.rides.push(r);
    save();ui.stack.pop();ui.draft=null;
    if(!ui.stack.length){ui.tab=r.date===iso()?"today":"cal";ui.cal=r.date;}
    render();toast(i>=0?"Fahrt gesichert":"Fahrt angelegt · "+relDay(r.date)+" "+r.time);
  } else if(ev.target.id==="contactForm"){
    if(!d.name.trim())return fail("Bitte einen Namen eintragen.");
    var c={id:d.id||uid(),name:d.name.trim(),phone:(d.phone||"").trim(),pickup:(d.pickup||"").trim(),dest:(d.dest||"").trim(),dur:Number(d.dur)||0,prices:d.prices||{},note:(d.note||"").trim(),fav:!!d.fav};
    var j=S.contacts.findIndex(function(x){return x.id===c.id;});if(j>=0)S.contacts[j]=c;else S.contacts.push(c);
    save();ui.stack.pop();ui.draft=null;if(j<0){ui.tab="contacts";ui.stack=[{type:"contact",id:c.id}];}render();toast("Kontakt gesichert");
  }
});
function applyTheme(){var r=document.documentElement,t=S.settings.theme;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");}

load();applyTheme();render();
setInterval(function(){if(!ui.stack.length&&(ui.tab==="today"||ui.tab==="cal"))render();},60000);
})();
</script>
</body>
</html>
